name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moodreel
          POSTGRES_PASSWORD: moodreel
          POSTGRES_DB: moodreel_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U moodreel -d moodreel_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_TEST: postgres://moodreel:moodreel@localhost:5433/moodreel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database tests
        run: npx vitest run --project db
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (laptop and iPhone sizes)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
